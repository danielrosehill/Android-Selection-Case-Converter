plugins {
    id "com.android.application"
}

android {
    namespace "com.danielrosehill.casemenu"
    compileSdk 35

    defaultConfig {
        applicationId "com.danielrosehill.casemenu"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // Signed with the standard Android debug keystore so anyone can rebuild an
        // update-compatible APK. Not a Play Store build.
        shared {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
